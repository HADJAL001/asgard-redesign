name: "OSGARD CodeQL config"

# Исключаем два запроса, дающих системные ложные срабатывания именно для
# этого репозитория (обоснование — в security-scan.yml и SECURITY.md):
#   - js/missing-rate-limiting: не распознаёт кастомный rateLimit-middleware
#     (../middleware/rateLimiter) и флагает КАЖДЫЙ роут, хотя лимиты стоят.
#   - js/user-controlled-bypass-of-sensitive-action: ложно срабатывает на
#     криптопроверке TOTP-кода 2FA (это и есть легитимная проверка).
# Все прочие security-запросы (инъекции, XSS, path traversal, hardcoded
# secrets и т.д.) остаются активными.
query-filters:
  - exclude:
      id: js/missing-rate-limiting
  - exclude:
      id: js/user-controlled-bypass-of-sensitive-action
