name: temporary-dependency-lock-refresh

on:
  push:
    branches:
      - fix/dependency-audit-runtime

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refresh root lockfile with compatible security patches
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Refresh backend lockfile with compatible security patches
        run: npm --prefix backend audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Report production audit results
        run: |
          npm audit --omit=dev --audit-level=high || true
          npm --prefix backend audit --omit=dev --audit-level=critical || true
      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes were generated."
            exit 0
          fi
          git commit -m "fix(deps): refresh lockfiles with compatible security patches"
          git push origin "$GITHUB_REF_NAME"
