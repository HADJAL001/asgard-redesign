name: design-system-quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * *"

permissions:
  contents: read

concurrency:
  group: design-system-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend build and test contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm run build
      - run: npm test

  production-contract:
    name: Production design-system contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run lint:quality
      - run: npm run test:design-system
      - run: npm run test:analytics-contract
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/design-system.spec.ts --reporter=line
      - run: npm run test:design-system-browser
        env:
          DESIGN_SYSTEM_BASE_URL: https://osgardnewworld.com
          DESIGN_SYSTEM_VISUAL_BASELINE: 3f57014d448c72ed10e1f434aede2e36e5de87d71c844d088088da54f333cc81,bb66298f34dd0a80a1d069db74ad75999a703f07892efb777860290b2c001c42
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: design-system-playwright-report
          path: |
            playwright-report/
            test-results/
            artifacts/design-system/
          if-no-files-found: ignore
        env:
          DESIGN_SYSTEM_BASE_URL: https://osgardnewworld.com
          DESIGN_SYSTEM_ORIGIN: https://osgardnewworld.com
