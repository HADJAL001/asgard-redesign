name: design-system-quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * *"

permissions:
  contents: read

concurrency:
  group: design-system-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-contract:
    name: Production design-system contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run test:design-system
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/design-system.spec.ts --reporter=line
      - run: npm run test:design-system-browser
        env:
          DESIGN_SYSTEM_BASE_URL: https://osgardnewworld.com
          DESIGN_SYSTEM_VISUAL_BASELINE: 545c1d6409d53b03a3f2008dbddf8b2581ed168dfd7ba53b6d956934d855c8ad
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: design-system-playwright-report
          path: |
            playwright-report/
            test-results/
            artifacts/design-system/
          if-no-files-found: ignore
        env:
          DESIGN_SYSTEM_BASE_URL: https://osgardnewworld.com
          DESIGN_SYSTEM_ORIGIN: https://osgardnewworld.com
