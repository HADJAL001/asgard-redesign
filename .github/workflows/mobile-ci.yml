name: mobile-ci

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test -- --watchAll=false

  e2e-android:
    needs: test
    runs-on: ubuntu-latest
    # Gradle APK compilation plus the API-34 emulator cold boot can exceed
    # 30 minutes on GitHub-hosted runners. Keep the real Detox gate intact,
    # but give it enough wall-clock budget to finish instead of being killed.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # GitHub-hosted Linux runners expose nested virtualization, but the
      # runner user is not always in the kvm group. Without this, the emulator
      # cold-boots in software mode and can die before Android services load.
      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            backend/package-lock.json

      - name: "Backend: install deps"
        working-directory: backend
        run: npm ci

      - name: "Backend: init DB + seed demo user (alex_odin)"
        working-directory: backend
        run: |
          npm run init-db
          npm run migrate:orderbook
          npm run migrate:referrals
          npm run migrate:premium-upgrade
          npm run migrate:subscriptions

      - name: "Backend: build"
        working-directory: backend
        run: npm run build

      - name: "Backend: start server"
        working-directory: backend
        run: |
          nohup npm start > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3002/health && break
            sleep 1
          done

      - name: "Mobile: install deps"
        working-directory: mobile
        run: npm ci

      - name: "Mobile: expo prebuild (android)"
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:3002
        run: npx expo prebuild --platform android

      - name: "Mobile: bump Gradle JVM heap (avoid OOM during androidTest dexing)"
        working-directory: mobile
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: "Mobile: build Detox android debug + androidTest APKs"
        working-directory: mobile
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.workers.max=2"
        run: npm run e2e:build:android

      - name: "Mobile: start Metro (JS bundler for debug APK)"
        working-directory: mobile
        run: |
          nohup npx expo start --port 8081 --non-interactive > metro.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/status && break
            sleep 1
          done

      - name: Install Android emulator runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse0

      - name: Run Detox e2e tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          avd-name: Pixel_7_API_34
          arch: x86_64
          profile: pixel_7
          disable-linux-hw-accel: false
          working-directory: mobile
          script: npm run e2e:test:android

      - name: Upload Detox artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detox-artifacts
          path: mobile/artifacts
          if-no-files-found: ignore

      # iOS e2e не настроен — конфиг ios.sim.debug в .detoxrc.js требует
      # macOS-раннера и Xcode; при необходимости добавить отдельный job
      # на macos-latest по аналогии с этим.
