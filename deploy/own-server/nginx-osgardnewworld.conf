# First install this HTTP server block, then run certbot --nginx after DNS for
# osgardnewworld.com points to this host. Certbot adds the HTTPS listener.
server {
    listen 80;
    server_name osgardnewworld.com www.osgardnewworld.com;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }

    include /etc/nginx/snippets-osgard-live-relay.conf;
}
