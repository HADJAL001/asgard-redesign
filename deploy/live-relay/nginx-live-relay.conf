# Included inside the TLS server block for osgardos.com.
# MediaMTX remains bound to loopback; only WHIP/WHEP signalling is public.
location ^~ /live/ {
    auth_request /__osgard_live_relay_authorize;
    proxy_pass http://127.0.0.1:8889;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Internal subrequest only. Next.js verifies a short-lived HMAC ticket that it
# issued after checking the user's OSGARD session against the production API.
location = /__osgard_live_relay_authorize {
    internal;
    proxy_pass http://127.0.0.1:3000/api/live-ticket;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Osgard-Live-Ticket $http_x_osgard_live_ticket;
    proxy_set_header X-Original-Method $request_method;
}
